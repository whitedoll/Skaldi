# 전역 용어집. 모든 작품에 적용된다.
#
# 작품별로 따로 두려면 (뒤에 오는 것이 이긴다):
#   1) 전역            이 파일
#   2) 작품별          zip 입력  → zip 옆에 <zip이름>.glossary.yaml   (예: book.zip → book.glossary.yaml)
#                      폴더 입력 → 그 폴더 안 glossary.yaml
#   3) 작업 폴더       <출력>/<이름>_ko/glossary.yaml  (한 번 돌린 뒤 고치기 좋다. --force 해도 안 지워진다)
#
# names 는 같은 키가 있으면 뒤엣것이 덮어쓰고, style 과 notes 는 이어 붙는다.
names: {}        # 예)  高崎梨杏: 타카사키 리안
style: |
  말투는 문맥에 맞게 판단한다. 인물 이름은 names에 적힌 표기를 그대로 쓴다.
notes: []        # 예)  - 주인공은 반말을 쓴다
