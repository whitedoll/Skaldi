[project]
name = "manga-transimage"
version = "0.1.0"
description = "일본어 만화 페이지를 한국어로 식자하는 개인용 CLI 도구"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=4.50",
    "safetensors>=0.5",
    "huggingface_hub>=0.30",
    "accelerate>=1.0",
    "pillow>=11",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "pyyaml>=6",
    "pydantic>=2.7",
    "ollama>=0.6",
    "httpx>=0.27",
    "rich>=13",
    "simple-lama-inpainting>=0.1.2",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
anytext = ["diffusers>=0.37", "scikit-image>=0.24"]
gui = ["gradio>=5"]

[tool.uv]
override-dependencies = [
    "numpy>=2",
    "pillow>=11",
    "opencv-python>=4.10 ; sys_platform == 'never'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
